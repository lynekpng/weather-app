<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <div class="search-box">
        <input
          id="location-input"
          type="text"
          placeholder="Enter your location"
        />
        <button id="search-button">
          <img src="assets/icons/search.png" alt="search icon" />
        </button>
      </div>
    </header>

    <div class="darkModeDiv" id="dark-mode-toggle">
      <img
        src="/assets/icons/sun-icon.png"
        alt="Light Mode"
        class="img-checked"
      />
      <img
        src="/assets/icons/moon-icon.png"
        alt="Dark Mode"
        class="img-unchecked"
      />
    </div>

    <main class="main-container">
      <div class="current-container">
        <div class="location-container">
          <div class="location-and-date" id="location-and-date"></div>
          <div class="current-temperature" id="current-temperature"></div>
        </div>
        <div class="current-stats" id="current-stats"></div>
      </div>
      <div class="weather-by-hour" id="weather-by-hour"></div>
      <div class="next-4-days" id="next-4-days"></div>
    </main>
    <footer></footer>
    <script defer type="module" src="assets/javascript/main.js"></script>
  </body>
</html>
